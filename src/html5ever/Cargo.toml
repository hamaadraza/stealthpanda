[package]
name = "litefetch-html5ever"
version = "0.1.0"
edition = "2021"

[lib]
name = "litefetch_html5ever"
path = "lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
html5ever = "0.39.0"
string_cache = "0.9.0"
typed-arena = "2.0.2"
tikv-jemallocator = { version = "0.6.1", features = ["stats"], optional = true }
tikv-jemalloc-ctl = { version = "0.6.1", features = ["stats"], optional = true }
xml5ever = "0.39.0"
encoding_rs = "0.8"
idna = "1.1.0"
url = "2.5.8"
# stealthpanda: software canvas-2D rasterizer (see stealthpanda_canvas.rs).
tiny-skia = "0.11"
ttf-parser = "0.20"
# stealthpanda: real image encoders so canvas.toDataURL("image/jpeg"|"image/webp")
# emits actual JPEG/WebP bytes (not PNG under a jpeg/webp label). Both pure Rust.
jpeg-encoder = "0.6"
image-webp = "0.2"

[profile.release]
lto = true
codegen-units = 1

[features]
memstats = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
